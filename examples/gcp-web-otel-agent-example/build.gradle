plugins {
    id 'org.springframework.boot' version '4.1.2'
}

configurations {
    otelAgent
}

test {
    useJUnitPlatform {
        includeEngines 'junit-jupiter'
    }

    doFirst {
        jvmArgs "-javaagent:${configurations.otelAgent.singleFile}"
    }

    systemProperty 'otel.traces.exporter', 'logging'
    systemProperty 'otel.metrics.exporter', 'none'
    systemProperty 'otel.logs.exporter', 'none'
    systemProperty 'otel.service.name', 'junit5-tests'
    systemProperty 'otel.instrumentation.http.server.exclude-paths', '/actuator/**'
}

dependencies {
    otelAgent "io.opentelemetry.javaagent:opentelemetry-javaagent:2.33.1"

    implementation project(':on-demand:on-demand-spring-boot-starter-web')
    implementation project(":gcp:spring-boot-starter-gcp-web");
    implementation project(":gcp:request-response-spring-boot-starter-gcp-web");

    implementation("org.springframework.boot:spring-boot-starter-security")
    implementation("org.springframework.boot:spring-boot-starter-web")
    implementation("org.springframework.boot:spring-boot-starter-actuator")

    testImplementation project(":gcp:spring-boot-starter-gcp-web-test");
    testImplementation project(":gcp:request-response-spring-boot-starter-gcp-web-test");

    testImplementation("org.springframework.boot:spring-boot-starter-test")
    testImplementation("org.springframework.boot:spring-boot-restclient")
    testImplementation("org.springframework.boot:spring-boot-resttestclient")

    // JUnit Jupiter API and TestEngine implementation
    testImplementation("org.junit.jupiter:junit-jupiter-api")
    testImplementation("org.junit.jupiter:junit-jupiter-engine")

    testImplementation ("com.google.truth:truth:${googleTruthVersion}")
    testImplementation ("com.google.truth.extensions:truth-java8-extension:${googleTruthVersion}")

    testImplementation("io.opentelemetry:opentelemetry-sdk-testing")
    testImplementation project(":test:test-logback-junit")

    // for running locally with one-line logging: on the bootRun classpath, but not packaged by bootJar
    developmentOnly project(":gcp:spring-boot-starter-gcp-web-test")
    developmentOnly project(":gcp:request-response-spring-boot-starter-gcp-web-test")
}
