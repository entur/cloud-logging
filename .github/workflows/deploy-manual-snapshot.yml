name: Build snapshot and deploy to Maven Central
on:
  workflow_dispatch:
    inputs:
      version-increment:
        description: 'Version-increment'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  deploy-snapshot-gradle:
    uses: entur/gha-maven-central/.github/workflows/gradle-publish.yml@v1
    secrets: inherit
    permissions:
      contents: write
      issues: write
    with:
      java_version: 25
      next_version: ${{ inputs.version-increment }}
      version_strategy: tag
      snapshot: true
      push_to_repo: false

