
dependencies {
    api("org.slf4j:slf4j-api")

    api project(':appender')

    api ("ch.qos.logback:logback-classic")
    api ("ch.qos.logback:logback-core")

    // AI mode: AiBodyMarker, structured fields and request-response details read from the JSON of an event
    api ("net.logstash.logback:logstash-logback-encoder:${logbackLogstashVersion}")
    api ("tools.jackson.core:jackson-core")
    // AI mode: DevOpsLogger severities (DevOpsMarker) in both files
    api project(":api")

    // AI mode: the test listener for the failures file; Gradle and Maven provide the launcher when tests run
    compileOnly("org.junit.platform:junit-platform-launcher")
    testImplementation("org.junit.platform:junit-platform-launcher")

    api ("org.entur.logback-logstash-syntax-highlighting-decorators:logback-logstash-syntax-highlighting-decorators:${logbackLogstashSyntaxHighlightingDecoratorsVersion}")
}
